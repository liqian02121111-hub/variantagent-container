name: Build full VariantAgent environment

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. Download VariantAgent
      - name: Checkout VariantAgent
        uses: actions/checkout@v4
        with:
          repository: InternScience/VariantAgent
          ref: main
          path: VariantAgent

      # 2. Fix unavailable Python dependency
      - name: Fix canton Python dependencies
        run: |
          set -euo pipefail

          REQ="VariantAgent/docker/config/canton_pip_requirements.txt"

          echo "Before:"
          grep -n '^fitz==0\.0\.1\.dev2$' "$REQ"

          sed -i \
            's/^fitz==0\.0\.1\.dev2$/PyMuPDF==1.26.6/' \
            "$REQ"

          echo "After:"
          grep -n '^PyMuPDF==1\.26\.6$' "$REQ"

          if grep -q '^fitz==' "$REQ"; then
            echo "ERROR: old fitz dependency remains"
            exit 1
          fi

          echo "Dependency fix successful"

      # 3. Check system resources
      - name: Check resources
        run: |
          nproc
          free -h
          df -h

      # 4. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Login to GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Build and push full environment
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./VariantAgent/docker
          file: ./VariantAgent/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/liqian02121111-hub/post-gwas:v1
          provenance: false

      # 7. Finish
      - name: Finished
        run: |
          echo "Build completed successfully"
          echo "Image: ghcr.io/liqian02121111-hub/post-gwas:v1"

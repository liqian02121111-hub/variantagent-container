name: Build full VariantAgent environment

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. Download official VariantAgent source
      - name: Checkout VariantAgent
        uses: actions/checkout@v4
        with:
          repository: InternScience/VariantAgent
          ref: main
          path: VariantAgent

      # 2. Check available storage
      - name: Check resources
        run: |
          nproc
          free -h
          df -h

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Log in to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build complete post-GWAS image
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./VariantAgent/docker
          file: ./VariantAgent/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/liqian02121111-hub/post-gwas:v1
          provenance: false

      # 6. Display result
      - name: Finished
        run: |
          echo "Build completed successfully"
          echo "Image: ghcr.io/liqian02121111-hub/post-gwas:v1"
